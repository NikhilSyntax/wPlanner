version: '3.8'

services:
  mongodb:
    image: mongo:8.0
    container_name: wplanner-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - wplanner-network

  redis:
    image: redis:7-alpine
    container_name: wplanner-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - wplanner-network

  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    container_name: wplanner-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/wplanner
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - REFRESH_SECRET=${REFRESH_SECRET}
    depends_on:
      - mongodb
      - redis
    networks:
      - wplanner-network

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    container_name: wplanner-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - wplanner-network

networks:
  wplanner-network:
    driver: bridge

volumes:
  mongo-data:
